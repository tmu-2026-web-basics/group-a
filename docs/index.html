<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tilestyle - Tokyo street style</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts (Roboto Mono) の読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===============================
       ヘッダー
  =============================== -->
  <header class="l-header">
    <div class="l-header__inner">
      <h1 class="c-logo"><a href="index.html"><span class="c-logo__tile">tile</span>style</a></h1>
    </div>
  </header>

  <!-- ===============================
       メインコンテンツ
  =============================== -->
  <main class="l-main">
    
    <!-- イントロダクション部分 -->
    <section class="p-intro">
      <div class="p-intro__inner">
        <p class="p-intro__text">下を向いて歩こう<br>普段は見過ごしてしまうけれど<br>足元に広がる芸術<br>それを取り囲む風景<br>新しい発見をしませんか</p>
        <p class="p-intro__highlight"></p>
      </div>
    </section>

    <!-- マップエリア -->
<section class="p-map-area">
  <div class="p-map-area__inner">
    <div class="p-map-area__content">
      <!-- ベースの地図画像 -->
      <img src="images/map.png" alt="東京都のマップ" class="p-map-img">

      <!-- ピン（地図上の位置に合わせて配置） -->
      <a href="detail1.html" class="c-map-pin c-map-pin--1" title="詳細1へ">
        <img src="images/pin.png" alt="ピン1">
      </a>
      <a href="detail2.html" class="c-map-pin c-map-pin--2" title="詳細2へ">
        <img src="images/pin.png" alt="ピン2">
      </a>
      <a href="detail3.html" class="c-map-pin c-map-pin--3" title="詳細3へ">
        <img src="images/pin.png" alt="ピン3">
      </a>
      <a href="detail4.html" class="c-map-pin c-map-pin--4" title="詳細4へ">
        <img src="images/pin.png" alt="ピン4">
      </a>
      <a href="detail5.html" class="c-map-pin c-map-pin--5" title="詳細5へ">
        <img src="images/pin.png" alt="ピン5">
      </a>
      <a href="detail6.html" class="c-map-pin c-map-pin--6" title="詳細6へ">
        <img src="images/pin.png" alt="ピン6">
      </a>
    </div>
  </div>
</section>


    <!-- タイル一覧（ギャラリー） -->
    <section class="p-gallery">
      <div class="p-gallery__inner">
        <ul class="p-gallery__list">
          <!-- 各タイル（詳細ページへのリンク） -->
          <li class="p-gallery__item">
            <a href="detail1.html" class="p-gallery__link">
              <img src="images/detail_1_1/street1.tile.jpg" alt="タイルの写真1" class="p-gallery__img">
            </a>
          </li>
          <li class="p-gallery__item">
            <a href="detail2.html" class="p-gallery__link">
              <img src="images/detail_2_2/street2.tile.jpg" alt="タイルの写真2" class="p-gallery__img">
            </a>
          </li>
          <li class="p-gallery__item">
            <a href="detail3.html" class="p-gallery__link">
              <img src="images/detail_3_1/street3.tile.jpg" alt="タイルの写真3" class="p-gallery__img">
            </a>
          </li>
          <li class="p-gallery__item">
            <a href="detail4.html" class="p-gallery__link">
              <img src="images/detail_4_2/street4.tile.jpg" alt="タイルの写真4" class="p-gallery__img">
            </a>
          </li>
          <li class="p-gallery__item">
            <a href="detail5.html" class="p-gallery__link">
              <img src="images/detail_5_1/street5.tile.png" alt="タイルの写真5" class="p-gallery__img">
            </a>
          </li>
          <li class="p-gallery__item">
            <a href="detail6.html" class="p-gallery__link">
              <img src="images/detail_6_2/street6.tile.png" alt="タイルの写真6" class="p-gallery__img">
            </a>
          </li>
        </ul>
      </div>
    </section>

  </main>

  <!-- ===============================
       フッター
  =============================== -->
  <footer class="l-footer">
    <div class="l-footer__inner">
      <small class="c-copyright">&copy; GroupA2026. All Rights Reserved.</small>
    </div>
  </footer>
<!-- トップに戻るボタン -->
<a href="#" class="c-pagetop" id="js-pagetop" aria-label="ページトップへ戻る">
  ↑
</a>

  <!-- JavaScriptの読み込み -->
  <script src="script.js"></script>
</body>
</html>
